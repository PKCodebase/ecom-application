#spring.application.name=ecom-application
#spring.h2.console.enabled=true
# spring.jpa.show-sql=true
# spring.jpa.hibernate.ddl-auto=create
# management.endpoints.web.exposure.include =*
spring:
  config:
    import: optional:file:./.env[.properties]

  application:
    name: ecom-application

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecom_db}
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true
management:
  endpoints:
    web:
      exposure:
        include: beans,health,info

  endpoint:
    health:
      show-details: always
    shutdown:
      enabled: true

  info:
    env:
      enabled: true

info:
  app:
    name: E-commerce Application
    description: A sample e-commerce application built with Spring Boot
    version: 1.0.0