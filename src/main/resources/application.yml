spring:
  config:
    import: optional:file:./.env[.properties]

  application:
    name: ecom-application

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecom_db}
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true